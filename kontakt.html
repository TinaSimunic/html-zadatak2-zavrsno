<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upisi | Šahovski klub Ilijada</title>
  <link rel="icon" href="slike/logo.jpg">
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 text-gray-800">
    <header class="sticky top-0 bg-white border-b border-gray-200">
        <div class="max-b-5xl mx-auto px-4 py-4 flex items-center justify-between">
            <a href="index.html" class="text-xl font-bold text-red-700"><img src="slike/logo.jpg" alt="Logo kluba Ilijada" class="inline-block h-10 w-10 mr-2 align-middle rounded-[19%]">Šahovski klub Ilijada</a>
            <nav class="hidden md:flex gap-6">
                <a href="index.html" class="hover:text-teal-700">Naslovnica</a>
                <a href="kontakt.html" class="hover:text-teal-700">Upisi</a>
                <a href="usluge.html" class="hover:text-teal-700">Turniri</a>
            </nav>
        </div>
    </header>

     <nav class="md:hidden bg-white border-b border-gray-200">
        <div class="flex justify-around py-2 text-sm">
            <nav class="hidden md:flex gap-6">
                <a href="index.html" class="hover:text-red-700">Naslovnica</a>
                <a href="kontakt.html" class="hover:text-red-700">Kontakt</a>
                <a href="usluge.html" class="hover:text-red-700">Turniri</a>
            </nav>
        </div>
    </nav>

    <section class="max-w-21 mx-auto px-4 py-12">
        <h1 class="text-2xl font-bold mb-6">Upisi u klub</h1>

        <form class="flex flex-col gap-4">

            <div class="flex flex-col md:flex-row gap-4">

                <div class="flex flex-col gap-1 w-full">
                    <label for="name" class="text-sm font-medium">Ime i prezime</label>
                    <input type="text" id="name" name="name"
                    class="border border-gray-300 rounded-md px-3 py-2 focus:border-red-600 focus:outline-none">
                </div>

                <div class="flex flex-col gap-1 w-full">
                    <label for="email" class="text-sm font-medium">E-mail adresa</label>
                    <input type="email" id="email" name="email"
                    class="border border-gray-300 rounded-md px-3 py-2 focus:border-red-600 focus:outline-none">
                </div>

            </div>

            <div class="flex flex-col gap-1">
                <label for="message" class="text-sm font-medium">Koji turnir vas zanima?</label>
                <textarea id="message" name="message" rows="4"
                    class="border border-gray-300 rounded-mg px-3 py-2 focus:border-red-600 focus:outline-none">
                </textarea>
            </div>

            <button type="submit"
                class="bg-red-700 text-white font-semibold px-6 py-3 rounded-mg hover:bg-red-800">
                Pošalji prijavu
            </button>

        </form>

    </section>

    <footer class="bg-gray-800 text-gray-300">
        <div class="max-w-5xl mx-auto px-4 py-8 flex flex-col md:flex-row justify-between gap-4 text-sm">
            <p><img src="slike/logo.jpg" alt="Logo kluba Ilijada" class="inline-block h-8 w-8 mr-2 align-middle rounded-[19%]">Šahovski klub Illijada, Trg mladih vitezova 15, Koprivnica</p>
            <p>Turniri se održavaju svakog utorka, četvrtka i nedjelje.</p>
        </div>
    </footer>

</body>
</html>
